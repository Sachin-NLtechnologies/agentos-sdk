name: ${AGENT_SLUG}

services:
  backend:
    image: ghcr.io/sachin-nltechnologies/${AGENT_SLUG}-backend:stable
    env_file: .env
    volumes:
      - __PKG___data:/data
      - static_data:/app/staticfiles
      - media_data:/data/media
    networks:
      agentos-net:
        aliases: [${AGENT_SLUG}-backend]
    depends_on:
      __PKG___db:
        condition: service_healthy
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  frontend:
    image: ghcr.io/sachin-nltechnologies/${AGENT_SLUG}-frontend:stable
    environment:
      - AGENT_SLUG=${AGENT_SLUG}
    env_file: .env
    volumes:
      - static_data:/app/staticfiles:ro
      - media_data:/media:ro
    networks:
      agentos-net:
        aliases: [${AGENT_SLUG}-frontend]
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  connector:
    image: ghcr.io/sachin-nltechnologies/${AGENT_SLUG}-backend:stable
    command: ["python", "manage.py", "connect_platform"]
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - __PKG___data:/data
    networks:
      agentos-net:
        aliases: [${AGENT_SLUG}-connector]
    depends_on:
      __PKG___db:
        condition: service_healthy
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - agentos-net
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  worker:
    image: ghcr.io/sachin-nltechnologies/${AGENT_SLUG}-backend:stable
    command: ["celery", "-A", "__PKG__", "worker", "-l", "info", "--concurrency=1"]
    env_file: .env
    volumes:
      - __PKG___data:/data
      - media_data:/data/media
    networks:
      - agentos-net
    depends_on:
      __PKG___db:
        condition: service_healthy
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  beat:
    image: ghcr.io/sachin-nltechnologies/${AGENT_SLUG}-backend:stable
    command: ["celery", "-A", "__PKG__", "beat", "-l", "info"]
    env_file: .env
    volumes:
      - __PKG___data:/data
    networks:
      - agentos-net
    depends_on:
      __PKG___db:
        condition: service_healthy
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - REPO_USER=${GHCR_USER}
      - REPO_PASS=${GHCR_PAT}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - agentos-net
    restart: always

  __PKG___db:
    image: postgres:16
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-__PKG__}
      - POSTGRES_USER=${POSTGRES_USER:-__PKG__}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - __PKG___pgdata:/var/lib/postgresql/data
    networks:
      - agentos-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-__PKG__} -d ${POSTGRES_DB:-__PKG__}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

volumes:
  __PKG___data:
  __PKG___pgdata:
  media_data:
  redis_data:
  static_data:

networks:
  agentos-net:
    external: true

