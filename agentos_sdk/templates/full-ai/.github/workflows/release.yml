name: Release

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ghcr.io/${{ github.repository }}-backend
  IMAGE_NAME_FRONTEND: ghcr.io/${{ github.repository }}-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt pyflakes
      - name: Run checks
        run: |
          cd backend
          python -m pyflakes pkg/ | grep -E "undefined name" && exit 1 || true
          pip check
          python manage.py check --fail-level WARNING
          python manage.py makemigrations --check --dry-run
        env:
          SECRET_KEY: dummy
          AGENTOS_KEY: dummy
          AGENTOS_URL: dummy
          AGENTOS_CLIENT_ID: dummy
          AGENTOS_CLIENT_SECRET: dummy
          AGENTOS_OIDC_ISSUER: dummy
          AGENTOS_OIDC_PUBLIC_ISSUER: dummy
          AGENTOS_REDIRECT_URI: dummy
          DEBUG: true

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_PAT }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: ${{ env.IMAGE_NAME_BACKEND }}:stable
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ${{ env.IMAGE_NAME_FRONTEND }}:stable
          build-args: |
            AGENT_BASE_PATH=/a/${{ vars.AGENT_SLUG }}/
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
